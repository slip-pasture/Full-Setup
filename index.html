<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finding Download Mirror</title>

<link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070b12'/%3E%3Cpath d='M32 12v27m0 0 11-11m-11 11L21 28M16 45h32' fill='none' stroke='%236dd8ff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
/* =========================================================
   GDX — CINEMATIC SPACE DOWNLOAD LANDER
   Cloudflare Pages / Standalone
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    background: #03060b;
}

body {
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    color: #edf7ff;
}

/* =========================================================
   SPACE BACKGROUND
========================================================= */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(22, 62, 86, .25) 0%,
            rgba(5, 13, 22, .55) 34%,
            #03060b 72%
        );
}

/* Deep atmospheric glow */

.space::before {
    content: "";
    position: absolute;
    width: 80vw;
    height: 80vw;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(55, 150, 193, .12) 0%,
            rgba(29, 83, 113, .055) 27%,
            transparent 65%
        );
    filter: blur(8px);
    pointer-events: none;
}

/* =========================================================
   STARS
========================================================= */

.stars,
.stars::before,
.stars::after {
    position: absolute;
    inset: 0;
    content: "";
    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(132,208,239,.6) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.55) 0 1px, transparent 1.5px);
    background-size:
        170px 170px,
        230px 230px,
        310px 310px;
    background-position:
        20px 40px,
        100px 80px,
        40px 120px;
}

.stars {
    opacity: .65;
    animation: starDrift 45s linear infinite;
}

.stars::before {
    opacity: .35;
    transform: scale(1.4);
    animation: starDriftReverse 70s linear infinite;
}

.stars::after {
    opacity: .22;
    transform: scale(1.8);
    animation: starDrift 90s linear infinite;
}

@keyframes starDrift {
    from {
        transform: translate3d(0,0,0);
    }
    to {
        transform: translate3d(-80px,55px,0);
    }
}

@keyframes starDriftReverse {
    from {
        transform: translate3d(0,0,0) scale(1.4);
    }
    to {
        transform: translate3d(70px,-45px,0) scale(1.4);
    }
}

/* =========================================================
   DISTANT PLANET / NEBULA
========================================================= */

.planet-glow {
    position: absolute;
    width: 44vw;
    height: 44vw;
    max-width: 620px;
    max-height: 620px;
    min-width: 340px;
    min-height: 340px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 38% 34%,
            rgba(102,190,220,.15),
            rgba(21,63,84,.08) 34%,
            transparent 68%
        );

    filter: blur(1px);

    animation: planetPulse 8s ease-in-out infinite;
}

@keyframes planetPulse {
    0%,100% {
        opacity: .7;
        transform: translate(-50%,-50%) scale(1);
    }

    50% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.045);
    }
}

/* =========================================================
   ORBIT
========================================================= */

.orbit {
    position: absolute;
    width: 650px;
    height: 190px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-9deg);
    border: 1px solid rgba(104,205,239,.10);
    border-radius: 50%;
    box-shadow:
        0 0 35px rgba(57,166,207,.05),
        inset 0 0 35px rgba(57,166,207,.03);

    animation: orbitMove 18s linear infinite;
}

.orbit::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9ee9ff;
    box-shadow:
        0 0 12px #64d8ff,
        0 0 25px rgba(100,216,255,.65);

    left: 8%;
    top: 50%;
    transform: translateY(-50%);
}

@keyframes orbitMove {
    from {
        transform: translate(-50%, -50%) rotate(-9deg) rotate(0deg);
    }

    to {
        transform: translate(-50%, -50%) rotate(-9deg) rotate(360deg);
    }
}

/* =========================================================
   SHOOTING STARS
========================================================= */

.shooting-star {
    position: absolute;
    width: 130px;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(183,236,255,.85)
    );
    transform: rotate(-35deg);
    opacity: 0;
    filter: drop-shadow(0 0 4px rgba(101,211,255,.5));
}

.shooting-star:nth-child(1) {
    top: 18%;
    left: 15%;
    animation: shoot 7s 1s infinite;
}

.shooting-star:nth-child(2) {
    top: 34%;
    right: 10%;
    animation: shoot 9s 4s infinite;
}

.shooting-star:nth-child(3) {
    top: 65%;
    left: 5%;
    animation: shoot 11s 7s infinite;
}

@keyframes shoot {
    0%,78% {
        opacity: 0;
        transform: translate3d(0,0,0) rotate(-35deg);
    }

    82% {
        opacity: 1;
    }

    92% {
        opacity: 0;
        transform: translate3d(260px,170px,0) rotate(-35deg);
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   CINEMATIC VIGNETTE
========================================================= */

.vignette {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 38%,
            rgba(0,0,0,.28) 72%,
            rgba(0,0,0,.78) 100%
        );

    pointer-events: none;
}

/* =========================================================
   CHARACTER AREA
========================================================= */

.character {
    position: absolute;
    bottom: -8vh;
    width: 430px;
    height: 650px;
    pointer-events: none;
    opacity: .78;
}

.character.left {
    left: -40px;
    transform: scaleX(-1);
}

.character.right {
    right: -40px;
}

/* Atmospheric character glow */

.character::before {
    content: "";
    position: absolute;
    width: 250px;
    height: 420px;
    left: 90px;
    top: 110px;
    background: radial-gradient(
        ellipse,
        rgba(76,171,205,.12),
        transparent 68%
    );
    filter: blur(20px);
}

/* Helmet */

.helmet {
    position: absolute;
    width: 154px;
    height: 170px;
    left: 140px;
    top: 40px;

    border-radius: 47% 47% 42% 42%;

    background:
        linear-gradient(
            145deg,
            #293641,
            #10171d 48%,
            #05090d
        );

    border: 2px solid rgba(183,229,243,.15);

    box-shadow:
        inset 12px 8px 25px rgba(255,255,255,.07),
        inset -15px -20px 35px rgba(0,0,0,.75),
        0 15px 50px rgba(0,0,0,.55);
}

/* Visor */

.visor {
    position: absolute;
    left: 17px;
    top: 34px;
    width: 120px;
    height: 94px;

    border-radius: 46% 46% 42% 42%;

    background:
        linear-gradient(
            145deg,
            #071219,
            #102c39 52%,
            #03080c
        );

    border: 1px solid rgba(112,211,238,.22);

    box-shadow:
        inset 10px 8px 25px rgba(103,211,239,.10),
        inset -15px -12px 25px rgba(0,0,0,.75),
        0 0 24px rgba(65,181,216,.06);
}

/* visor reflection */

.visor::before {
    content: "";
    position: absolute;
    width: 70px;
    height: 16px;
    left: 15px;
    top: 15px;

    transform: rotate(-22deg);

    background: linear-gradient(
        90deg,
        transparent,
        rgba(176,235,250,.20),
        transparent
    );

    filter: blur(2px);
}

/* Neck */

.neck {
    position: absolute;
    width: 90px;
    height: 48px;
    left: 172px;
    top: 183px;
    border-radius: 12px 12px 22px 22px;
    background: #10171c;
    border: 1px solid rgba(255,255,255,.06);
}

/* Body */

.body {
    position: absolute;
    left: 106px;
    top: 215px;
    width: 220px;
    height: 330px;

    border-radius: 70px 70px 35px 35px;

    background:
        linear-gradient(
            120deg,
            #27343c 0%,
            #11191f 35%,
            #070b0f 75%
        );

    border: 1px solid rgba(191,224,235,.11);

    box-shadow:
        inset 20px 0 30px rgba(255,255,255,.025),
        inset -25px 0 35px rgba(0,0,0,.65),
        0 20px 60px rgba(0,0,0,.55);
}

/* Chest panel */

.chest-panel {
    position: absolute;
    width: 92px;
    height: 82px;
    left: 64px;
    top: 48px;

    border-radius: 12px;

    background: #080e13;
    border: 1px solid rgba(111,206,232,.13);

    box-shadow:
        inset 0 0 15px rgba(76,177,208,.04);
}

.chest-panel::before,
.chest-panel::after {
    content: "";
    position: absolute;
    left: 13px;
    right: 13px;
    height: 2px;
    background: rgba(103,202,229,.22);
}

.chest-panel::before {
    top: 27px;
}

.chest-panel::after {
    top: 43px;
}

/* Chest light */

.chest-light {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    right: 12px;
    top: 12px;

    background: #70dfff;

    box-shadow:
        0 0 9px rgba(112,223,255,.9);

    animation: lightBlink 2.6s ease-in-out infinite;
}

@keyframes lightBlink {
    0%,100% { opacity: .45; }
    50% { opacity: 1; }
}

/* Shoulder */

.shoulder {
    position: absolute;
    width: 76px;
    height: 96px;
    top: 227px;

    background:
        linear-gradient(
            145deg,
            #2a3740,
            #0b1116
        );

    border-radius: 38px 25px 35px 25px;
    border: 1px solid rgba(255,255,255,.07);
}

.shoulder.one {
    left: 60px;
}

.shoulder.two {
    right: 60px;
}

/* Arm */

.arm {
    position: absolute;
    width: 58px;
    height: 220px;
    top: 275px;

    background:
        linear-gradient(
            90deg,
            #202c33,
            #080d12
        );

    border-radius: 35px;

    border: 1px solid rgba(255,255,255,.055);

    transform-origin: top center;
}

.arm.one {
    left: 47px;
    transform: rotate(10deg);
}

.arm.two {
    right: 47px;
    transform: rotate(-8deg);
}

/* =========================================================
   MAIN CONTENT
========================================================= */

.content {
    position: relative;
    z-index: 20;

    width: 100%;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}

.center {
    width: min(650px, 92vw);
    margin-top: -10px;
}

/* Small label */

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    margin-bottom: 22px;

    color: rgba(188,223,235,.66);

    font-size: 11px;
    font-weight: 600;

    letter-spacing: .28em;
    text-transform: uppercase;
}

.eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;

    background: #69d8fa;

    box-shadow:
        0 0 12px rgba(105,216,250,.85);

    animation: statusPulse 1.8s ease-in-out infinite;
}

@keyframes statusPulse {
    0%,100% {
        opacity: .45;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1);
    }
}

/* Download icon */

.download-symbol {
    width: 72px;
    height: 72px;

    margin: 0 auto 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #d9f5ff;

    opacity: .94;

    animation: iconFloat 4s ease-in-out infinite;
}

.download-symbol svg {
    width: 62px;
    height: 62px;

    overflow: visible;

    filter:
        drop-shadow(0 0 10px rgba(94,210,242,.20));
}

@keyframes iconFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

/* Heading */

h1 {
    margin: 0;

    font-size: clamp(34px, 5vw, 58px);

    line-height: 1.04;

    font-weight: 650;

    letter-spacing: -.045em;

    color: #f2f8fb;

    text-shadow:
        0 2px 20px rgba(0,0,0,.5);
}

h1 span {
    color: #75d9f6;
}

/* Description */

.description {
    max-width: 520px;

    margin: 20px auto 0;

    color: rgba(208,226,235,.65);

    font-size: 14px;
    line-height: 1.75;

    letter-spacing: .01em;
}

/* Progress */

.progress-wrap {
    width: min(420px, 75vw);

    margin: 35px auto 0;
}

.progress-top {
    display: flex;
    justify-content: space-between;

    margin-bottom: 10px;

    color: rgba(199,225,235,.50);

    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
}

.progress-track {
    position: relative;

    height: 2px;

    overflow: hidden;

    background: rgba(172,214,228,.10);
}

.progress-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 0%;
    height: 100%;

    background: #78dbf7;

    box-shadow:
        0 0 12px rgba(120,219,247,.7);

    transition: width .15s linear;
}

/* subtle scanning line */

.scan {
    position: absolute;
    left: -20%;
    top: 0;

    width: 20%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(198,242,255,.65),
            transparent
        );

    animation: scan 2.8s linear infinite;
}

@keyframes scan {
    from {
        left: -20%;
    }

    to {
        left: 110%;
    }
}

/* Bottom text */

.bottom-note {
    margin-top: 22px;

    color: rgba(183,207,218,.38);

    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .character {
        opacity: .27;
        transform: scale(.72);
        bottom: -70px;
    }

    .character.left {
        left: -170px;
    }

    .character.right {
        right: -170px;
    }

    .orbit {
        width: 500px;
    }
}

@media (max-width: 600px) {

    html,
    body {
        overflow: hidden;
    }

    .character {
        opacity: .17;
        transform: scale(.55);
        bottom: -130px;
    }

    .character.left {
        left: -220px;
    }

    .character.right {
        right: -220px;
    }

    .planet-glow {
        width: 110vw;
        height: 110vw;
    }

    .orbit {
        width: 390px;
        height: 130px;
    }

    h1 {
        font-size: 37px;
    }

    .description {
        font-size: 13px;
        max-width: 340px;
    }

    .progress-wrap {
        width: 80vw;
    }
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div class="space">

    <div class="stars"></div>

    <div class="planet-glow"></div>

    <div class="orbit"></div>

    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

    <!-- LEFT CHARACTER -->
    <div class="character left">

        <div class="helmet">
            <div class="visor"></div>
        </div>

        <div class="neck"></div>

        <div class="body">
            <div class="chest-panel">
                <div class="chest-light"></div>
            </div>
        </div>

        <div class="shoulder one"></div>
        <div class="shoulder two"></div>

        <div class="arm one"></div>
        <div class="arm two"></div>

    </div>

    <!-- RIGHT CHARACTER -->
    <div class="character right">

        <div class="helmet">
            <div class="visor"></div>
        </div>

        <div class="neck"></div>

        <div class="body">
            <div class="chest-panel">
                <div class="chest-light"></div>
            </div>
        </div>

        <div class="shoulder one"></div>
        <div class="shoulder two"></div>

        <div class="arm one"></div>
        <div class="arm two"></div>

    </div>

    <div class="vignette"></div>

</div>


<main class="content">

    <section class="center">

        <div class="eyebrow">
            Download Center
        </div>

        <div class="download-symbol">

            <svg viewBox="0 0 64 64" fill="none"
                 xmlns="http://www.w3.org/2000/svg">

                <path
                    d="M32 8V39"
                    stroke="currentColor"
                    stroke-width="4"
                    stroke-linecap="round"/>

                <path
                    d="M19 27L32 40L45 27"
                    stroke="currentColor"
                    stroke-width="4"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

                <path
                    d="M13 50H51"
                    stroke="currentColor"
                    stroke-width="4"
                    stroke-linecap="round"/>

                <path
                    d="M18 50V55H46V50"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                    opacity=".45"/>

            </svg>

        </div>

        <h1>
            Finding <span>Download Mirror</span>
        </h1>

        <p class="description">
            We're preparing the available download location for your file.
            Please wait while the connection is being established.
        </p>

        <div class="progress-wrap">

            <div class="progress-top">
                <span id="status">Locating mirror</span>
                <span id="percent">0%</span>
            </div>

            <div class="progress-track">
                <div class="progress-bar" id="progress"></div>
                <div class="scan"></div>
            </div>

        </div>

        <div class="bottom-note">
            Redirecting automatically
        </div>

    </section>

</main>


<script>
/* =========================================================
   REDIRECT
========================================================= */

(function () {

    const encodedDestination =
        "aHR0cDovL2dpdGRyaXZlLnNpdGUv";

    const destination =
        atob(encodedDestination);

    const progress =
        document.getElementById("progress");

    const percent =
        document.getElementById("percent");

    const status =
        document.getElementById("status");

    const stages = [
        "Locating mirror",
        "Checking availability",
        "Preparing download",
        "Connection ready"
    ];

    const duration = 4200;
    const start = performance.now();

    function animate(now) {

        const elapsed = now - start;
        const ratio = Math.min(elapsed / duration, 1);

        /*
         * Smooth non-linear progress.
         * Starts quickly, slows slightly near completion.
         */
        const eased =
            1 - Math.pow(1 - ratio, 2.2);

        const value =
            Math.min(100, Math.floor(eased * 100));

        progress.style.width = value + "%";
        percent.textContent = value + "%";

        const stage =
            Math.min(
                stages.length - 1,
                Math.floor(ratio * stages.length)
            );

        status.textContent = stages[stage];

        if (ratio < 1) {

            requestAnimationFrame(animate);

        } else {

            status.textContent = "Redirecting";

            setTimeout(function () {
                window.location.replace(destination);
            }, 250);

        }
    }

    requestAnimationFrame(animate);

})();
</script>

</body>
